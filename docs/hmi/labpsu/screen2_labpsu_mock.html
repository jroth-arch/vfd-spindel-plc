<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2 LAB PSU</title><style>body{margin:0;background:#c9d1d8;font:16px Tahoma, sans-serif;color:#1f2a33;display:grid;place-items:center;min-height:100vh}.panel{width:min(800px,94vw);background:#d7dce1;border:2px solid #66727c;padding:18px}.head,.card{background:#eef1f4;border:1px solid #7f8a93;padding:14px;margin-bottom:12px}.head{font-size:24px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.value,input{width:125px;padding:7px;border:1px solid #7f8a93;background:#fff;font:inherit;font-weight:bold}.mode-fields{display:flex;gap:6px}.mode-fields input{width:42px}.mode-fields .value{width:104px;display:inline-block;text-align:center;white-space:nowrap}.ok{color:#2e7d32}.run{color:#1565c0}.bad{color:#c62828}.nav{padding-top:8px;border-top:1px solid #7f8a93}</style></head><body><main class="panel"><div class="head">LAB PSU <span class="run">SINE DEBUG 0..A</span></div><div class="grid"><section class="card"><b>NASTAVENI</b><div class="row">Enable <input id="enableInput" type="number" min="0" max="1" step="1" value="1"></div><div class="row">Mode <div class="mode-fields"><input id="modeInput" type="number" min="0" max="2" step="1" value="2"><strong id="modeText" class="value">SINE_DEBUG</strong></div></div><div class="row">Sinusovy proud [A] <input value="5.0"></div><div class="row">Perioda [min] <input value="1.0"></div></section><section class="card"><b>MONITORING</b><div class="row">Stavovy text <strong id="statusText" class="value">SINE DEBUG 0..A</strong></div><div class="row">Aktualni proud <strong class="value">3.2 A</strong></div><div class="row">Current limit <strong class="ok">NO</strong></div></section></div><div class="nav">S1 HOME | S2 LAB PSU | S3 VRETENO | S4 SAFETY | S5 LOG | S7 SERVIS</div><script>const enableInput=document.getElementById("enableInput");const modeInput=document.getElementById("modeInput");const modeText=document.getElementById("modeText");const statusText=document.getElementById("statusText");const modeLabels={0:"OFF",1:"CONST",2:"SINE_DEBUG"};function clampInteger(input,min,max){const value=Number(input.value);if(Number.isNaN(value)){input.value=String(min);return min}const clamped=Math.min(max,Math.max(min,Math.round(value)));input.value=String(clamped);return clamped}function updateMode(){const mode=clampInteger(modeInput,0,2);modeText.textContent=modeLabels[mode];statusText.textContent=mode===0?"OFF":mode===1?"CONST":"SINE DEBUG 0..A"}enableInput.addEventListener("input",()=>clampInteger(enableInput,0,1));modeInput.addEventListener("input",updateMode);updateMode()</script></main></body></html>
